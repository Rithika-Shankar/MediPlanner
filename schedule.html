<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-Care & Wellness Tracker</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #181818;
      color: #e0e0e0;
      font-family: 'Poppins', sans-serif;
    }
    h1 {
      color: #fff;
      margin-bottom: 20px;
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      padding: 15px;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #1959c9;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #007bff;
    }
    .wellness-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .navbar {
      background-color: #2b2b2b;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .navbar .nav-link {
      color: #b9cce1;
      font-weight: bold;
    }
    .navbar-toggler {
      background-color: #1445c1;
    }
    .journal-textarea {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      min-height: 120px;
      resize: none;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#" style="color: #fff;">MediPlanner</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="color: #fff;">☰</span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="text-center">
      <h1>Self-Care & Wellness Tracker</h1>
      <p class="lead">Track your sleep, hydration, meals, stress levels, and mental health reflections.</p>
    </div>

    <!-- Track Self-Care Activities -->
    <div class="glass-effect p-4 mb-4">
      <h4 class="mb-3">Track Your Self-Care</h4>
      <form id="wellness-form">
        <div class="form-row">
          <div class="col-md-6 mb-3">
            <label for="sleep-hours">Sleep (hours)</label>
            <input type="number" class="form-control" id="sleep-hours" placeholder="Enter hours of sleep" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="water-intake">Water Intake (L)</label>
            <input type="number" step="0.1" class="form-control" id="water-intake" placeholder="Enter liters of water" required>
          </div>
        </div>
        <div class="form-row">
          <div class="col-md-6 mb-3">
            <label for="meals">Meals</label>
            <input type="text" class="form-control" id="meals" placeholder="Enter meals for the day" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="stress-level">Stress Level (1-10)</label>
            <input type="number" class="form-control" id="stress-level" min="1" max="10" placeholder="Rate your stress level" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    </div>

    <!-- Journal Section -->
    <div class="glass-effect p-4 mb-4">
      <h4 class="mb-3">Mental Health Journal</h4>
      <textarea id="journal-entry" class="journal-textarea" placeholder="Write about your day, stressors, and how you're feeling..."></textarea>
      <button id="save-journal" class="btn btn-primary mt-3">Save Journal</button>
    </div>

    <!-- Wellness Log Section -->
    <div class="glass-effect p-4">
      <h4 class="mb-3">Your Wellness Log</h4>
      <div id="wellness-log">
        <p>No self-care data saved yet.</p>
      </div>
    </div>
  </div>

  <script>
    const wellnessForm = document.getElementById('wellness-form');
    const sleepHoursInput = document.getElementById('sleep-hours');
    const waterIntakeInput = document.getElementById('water-intake');
    const mealsInput = document.getElementById('meals');
    const stressLevelInput = document.getElementById('stress-level');
    const journalEntryInput = document.getElementById('journal-entry');
    const wellnessLog = document.getElementById('wellness-log');
    const saveJournalButton = document.getElementById('save-journal');

    let wellnessData = JSON.parse(localStorage.getItem('wellnessData')) || [];

    // Save wellness data to localStorage
    function saveWellnessDataToLocalStorage() {
      localStorage.setItem('wellnessData', JSON.stringify(wellnessData));
    }

    // Render wellness log with delete and edit functionality
    function renderWellnessLog() {
      wellnessLog.innerHTML = '';
      if (wellnessData.length === 0) {
        wellnessLog.innerHTML = '<p>No self-care data saved yet.</p>';
        return;
      }
      wellnessData.forEach((data, index) => {
        const wellnessItem = document.createElement('div');
        wellnessItem.className = 'wellness-item';
        wellnessItem.innerHTML = `
          <div>
            <p><strong>Sleep:</strong> ${data.sleepHours} hours</p>
            <p><strong>Water Intake:</strong> ${data.waterIntake} L</p>
            <p><strong>Meals:</strong> ${data.meals}</p>
            <p><strong>Stress Level:</strong> ${data.stressLevel}/10</p>
            <p><strong>Journal:</strong> ${data.journal || 'No journal entry yet'}</p>
          </div>
          <div>
            <button class="btn btn-warning btn-sm" onclick="editWellnessLog(${index})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteWellnessLog(${index})">Delete</button>
          </div>
        `;
        wellnessLog.appendChild(wellnessItem);
      });
    }

    // Handle wellness form submission
    wellnessForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const wellnessDataEntry = {
        sleepHours: sleepHoursInput.value.trim(),
        waterIntake: waterIntakeInput.value.trim(),
        meals: mealsInput.value.trim(),
        stressLevel: stressLevelInput.value.trim(),
        journal: '',
      };

      wellnessData.push(wellnessDataEntry);
      saveWellnessDataToLocalStorage();
      wellnessForm.reset();
      renderWellnessLog();
    });

    // Handle journal entry saving
    saveJournalButton.addEventListener('click', () => {
      const lastEntry = wellnessData[wellnessData.length - 1];
      lastEntry.journal = journalEntryInput.value.trim();
      saveWellnessDataToLocalStorage();
      renderWellnessLog();
      journalEntryInput.value = '';
    });

    // Edit wellness log
    function editWellnessLog(index) {
      const entry = wellnessData[index];
      sleepHoursInput.value = entry.sleepHours;
      waterIntakeInput.value = entry.waterIntake;
      mealsInput.value = entry.meals;
      stressLevelInput.value = entry.stressLevel;
      journalEntryInput.value = entry.journal || '';
      wellnessData.splice(index, 1);
      saveWellnessDataToLocalStorage();
      renderWellnessLog();
    }

    // Delete wellness log
    function deleteWellnessLog(index) {
      wellnessData.splice(index, 1);
      saveWellnessDataToLocalStorage();
      renderWellnessLog();
    }

    // Initial render of wellness log
    renderWellnessLog();
  </script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
