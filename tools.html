<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Tools</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #181818;
      color: #e0e0e0;
      font-family: 'Poppins', sans-serif;
    }
    h1 {
      color: #fff;
      margin-bottom: 20px;
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      padding: 15px;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #1959c9;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    .navbar {
      background-color: #2b2b2b;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .navbar .nav-link {
      color: #b9cce1;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #007bff;
    }
    .form-row label {
      font-weight: bold;
    }
    .navbar-toggler {
      background-color: #1445c1;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#" style="color: #fff;">MediPlanner</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="color: #fff;">☰</span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="text-center">
      <h1>Medical Tools</h1>
      <p class="lead">Access helpful medical tools to track your health.</p>
    </div>

    <!-- BMI Calculator -->
    <div class="glass-effect p-4 mb-4">
      <h4 class="mb-3">BMI Calculator</h4>
      <form id="bmi-form">
        <div class="form-row">
          <div class="col-md-6 mb-3">
            <label for="height">Height (in cm)</label>
            <input type="number" class="form-control" id="height" placeholder="Enter height" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="weight">Weight (in kg)</label>
            <input type="number" class="form-control" id="weight" placeholder="Enter weight" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Calculate BMI</button>
      </form>
      <p class="mt-3" id="bmi-result"></p>
    </div>

    <!-- Drug Event Checker -->
    <div class="glass-effect p-4">
      <h4 class="mb-3">Drug Event Checker</h4>
      <form id="drug-event-form">
        <div class="form-row">
          <div class="col-md-6 mb-3">
            <label for="drug-event">Drug Name</label>
            <input type="text" class="form-control" id="drug-event" placeholder="Enter drug name" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Check Events</button>
      </form>
      <p class="mt-3" id="event-result"></p>
    </div>
  </div>

  <script>
    // BMI Calculator
    document.getElementById("bmi-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const height = parseFloat(document.getElementById("height").value) / 100; // Convert cm to meters
      const weight = parseFloat(document.getElementById("weight").value);
      if (height > 0 && weight > 0) {
        const bmi = (weight / (height * height)).toFixed(2);
        let category = "";
        if (bmi < 18.5) category = "Underweight";
        else if (bmi < 24.9) category = "Normal weight";
        else if (bmi < 29.9) category = "Overweight";
        else category = "Obesity";
        document.getElementById("bmi-result").textContent = `Your BMI is ${bmi} (${category}).`;
      } else {
        document.getElementById("bmi-result").textContent = "Please enter valid height and weight.";
      }
    });

    // Drug Event Checker
document.getElementById("drug-event-form").addEventListener("submit", async function (event) {
  event.preventDefault();
  const drug = document.getElementById("drug-event").value.trim();
  const resultContainer = document.getElementById("event-result");

  if (drug) {
    try {
      resultContainer.textContent = "Fetching drug event data...";

      const response = await fetch(`https://api.fda.gov/drug/event.json?search=patient.drug.medicinalproduct:${drug}&limit=1`);
      const data = await response.json();

      if (data.results && data.results.length > 0) {
        const event = data.results[0];
        const reactions = event.patient.reaction.map(r => r.reactionmeddrapt).join(", ");
        const rawDate = event.receiptdate || "Not Available";

        // Format the date if it's in the format YYYYMMDD
        let formattedDate = "Not Available";
        if (rawDate.length === 8) {
          const year = rawDate.slice(0, 4);
          const month = rawDate.slice(4, 6);
          const day = rawDate.slice(6, 8);
          formattedDate = new Date(`${year}-${month}-${day}`).toLocaleDateString(undefined, {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
        }

        resultContainer.innerHTML = `
          <h5>Adverse Event Data for ${drug}:</h5>
          <p><strong>Reactions:</strong> ${reactions || "Not Available"}</p>
          <p><strong>Seriousness:</strong> ${event.serious || "Not Available"}</p>
          <p><strong>Report Date:</strong> ${formattedDate}</p>
        `;
      } else {
        resultContainer.textContent = "No adverse event data found for the entered drug.";
      }
    } catch (error) {
      resultContainer.textContent = "Error fetching drug data. Please try again later.";
    }
  } else {
    resultContainer.textContent = "Please enter a drug name.";
  }
});

  </script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
